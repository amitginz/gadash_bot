<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC Map - גד"ש בוט</title>
    <!-- Bootstrap RTL CSS (from existing system assumption) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #f8f9fa; }
        #map { height: 600px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .info-card { padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2 class="mb-4 text-primary">PoC: זיהוי חלקה על המפה (Geofencing)</h2>
        <div class="row">
            <div class="col-md-8">
                <div id="map"></div>
            </div>
            <div class="col-md-4">
                <div class="info-card">
                    <h4>פרטי אירוע (סימולציה)</h4>
                    <hr>
                    <p><strong>נקודת ציון נכנסת (GPS):</strong> <br>
                       <span class="badge bg-secondary">{{ dummy_job.lat }}, {{ dummy_job.lon }}</span>
                    </p>
                    <p><strong>זיהוי חלקה אוטומטי (Shapely):</strong> <br>
                       <span class="badge bg-success fs-6">{{ matched_field }}</span>
                    </p>
                    <p><strong>פרטי העבודה (Dummy):</strong><br>
                       לקוח: משק כהן<br>
                       סוג עבודה: חריש<br>
                       מפעיל: עמית
                    </p>
                    <a href="/" class="btn btn-outline-primary mt-3 w-100">חזרה למסך הראשי</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Data injected from Flask
        var fieldsData = {{ fields|tojson }};
        var dummyJob = {{ dummy_job|tojson }};
        var matchedField = "{{ matched_field }}";

        // Initialize map centered roughly around the job or first field
        var mapCenter = [32.435, 35.495]; // Default center (Sdeh Eliyahu approx)
        if (dummyJob && dummyJob.lat) {
            mapCenter = [dummyJob.lat, dummyJob.lon];
        }
        var map = L.map('map').setView(mapCenter, 14);

        // Add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Draw Fields Polygons
        fieldsData.forEach(function(field) {
            var isMatched = (field.name === matchedField);
            var color = isMatched ? '#22c55e' : '#3b82f6'; // Green if matched, blue otherwise
            var fillColor = isMatched ? '#86efac' : '#93c5fd';

            var polygon = L.polygon(field.coordinates, {
                color: color,
                fillColor: fillColor,
                fillOpacity: 0.4,
                weight: 2
            }).addTo(map);
            
            polygon.bindPopup("<b>" + field.name + "</b>");
        });

        // Add Marker for the Dummy Job
        if (dummyJob && dummyJob.lat) {
            var marker = L.marker([dummyJob.lat, dummyJob.lon]).addTo(map);
            var popupContent = "<b>עבודה חדשה התקבלה!</b><br>" + 
                               "חלקה שזוהתה: " + matchedField + "<br>" +
                               "נ.צ: " + dummyJob.lat + ", " + dummyJob.lon;
            marker.bindPopup(popupContent).openPopup();
        }
    </script>
</body>
</html>
